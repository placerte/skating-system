[project]
name = "skating-system"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "placerte", email = "122181242+placerte@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=25.9.0",
    "pyfiglet>=1.0.4",
    "produm>=0.1.0",
    "textual>=6.6.0",
    "ttkbootstrap>=1.14.2",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.3",
]

[project.scripts]
skating-system = "skating_system.__main__:main"
